# GitHub Pages publishes the whole repo by default. Only the static site
# (index.html, CNAME, css/, js/, img/, favicons/, vendor/) should be served;
# the agent tooling and build sources below stay in the repo but off the site.
exclude:
  - AGENTS.md
  - CLAUDE.md
  - GEMINI.md
  - README.md
  - CODEOWNERS
  - bin
  - docs
  - lib
  - scripts
  - scss
  - skills
  - tools
  - package.json
  - package-lock.json
  - node_modules
